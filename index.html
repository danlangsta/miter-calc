    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .touch-target { min-height: 44px; min-width: 44px; }
        #three-container canvas { outline: none; cursor: grab; }
        #three-container canvas:active { cursor: grabbing; }
        ::selection { background-color: #CCDA46; color: #121417; }
        /* Printer-Friendly Cut Sheet Styles */
        @media print {
            body {
                background: #ffffff !important;
                color: #000000 !important;
                margin: 0 !important;
                padding: 0 !important;
            }
            header, main, .no-print {
                display: none !important;
            }
            #print-sheet {
                display: block !important;
                width: 100% !important;
                background: #ffffff !important;
                color: #000000 !important;
                padding: 0.25in !important;
                font-family: 'Inter', sans-serif !important;
            }
        }
    </style>
    <!-- Three.js ES Modules via CDN -->

        }
      }
    </script>
</head>
